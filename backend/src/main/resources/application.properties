
# 1. Configuración del Servidor Web
server.port=8080
# [cite_start]Context path (ej: /api/auth/login) [cite: 206]
server.servlet.context-path=/api

# [cite_start]2. Configuración de la Base de Datos (MySQL) [cite: 89]
# Apunta a la BD creada
spring.datasource.url=jdbc:mysql://localhost:3306/cita_med_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Configuración de JPA (Hibernate)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# [cite_start]CRÍTICO: No modificar la BD, ya la creamos [cite: 84-292]
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect.H2Dialect.globally_quoted_identifiers=true

# 4. Mostrar SQL (Debug)
spring.jpa.show-sql=true