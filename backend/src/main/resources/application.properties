# =========================================================
# FASE 1 - PASO 1.1: Configuración Central de la Aplicación
# =========================================================

# 1. Configuración del Servidor Web
# [cite_start]Puerto 8080 y Context-Path /api [cite: 385]
server.port=8080
server.servlet.context-path=/api

# 2. Configuración de la Base de Datos (DataSource)
spring.datasource.url=jdbc:mysql://localhost:3306/cita_med_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# 3. Configuración de JPA (Java Persistence API)
spring.jpa.hibernate.ddl-auto=none

# Habilitamos la visibilidad de las consultas SQL generadas por JPA (Buena práctica de desarrollo)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 4. Configuración de Seguridad (JWT)
# Esta clave debe ser larga, compleja y externalizada en producción (ej. variable de entorno)
