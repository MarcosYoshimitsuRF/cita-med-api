# =========================================================
# Cita-Med API - Configuración de Aplicación
# FASE 1 - PASO 1.1.3
# =========================================================

# 1. Configuración del Servidor
server.port=8080
server.servlet.context-path=/api

# 2. Configuración de la Base de Datos (MySQL)
# Reemplace 'root' y 'su_password_de_bd' con sus credenciales locales
spring.datasource.url=jdbc:mysql://localhost:3306/cita_med_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Configuración de JPA (Hibernate)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

